[workspace]
# Driver crates are deliberately excluded. They are build inputs the CLI
# compiles on demand against a subject's pinned ref (or a working tree under
# --subject-path), so making them default members would force everyone building
# the engine to also build every library under test.
members = [
  "crates/spatial-bench-core",
  "crates/spatial-bench-measure",
  "crates/spatial-bench-charting",
  "crates/spatial-bench-cli",
]
exclude = ["crates/spatial-bench-kiddo-v6"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sdd/spatial-bench"

[workspace.dependencies]
spatial-bench-core = { path = "crates/spatial-bench-core", version = "0.1.0" }
spatial-bench-measure = { path = "crates/spatial-bench-measure", version = "0.1.0" }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
