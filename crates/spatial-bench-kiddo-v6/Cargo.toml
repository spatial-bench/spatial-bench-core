[package]
name = "spatial-bench-kiddo-v6"
description = "spatial-bench driver for kiddo v6"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"

# Not a member of the engine workspace: the CLI builds this on demand, so
# building the engine does not drag kiddo in.
#
# The engine owns the harness, so the measurement code lives here and kiddo
# contributes only its public API. kiddo never depends on this crate.

# No kiddo dependency: every reference to it is inside a macro_rules body and
# expands at the call site, so only the *generated* crate needs kiddo. That is
# what lets the CLI point a build at a pinned ref or a working tree without this
# crate hardcoding a path to either.

[dependencies]
spatial-bench-core = { path = "../spatial-bench-core" }
rand = "0.10"
rand_chacha = "0.10"
serde_json = "1"
