[package]
name = "spatial-bench-core"
description = "Tag-addressed benchmark catalog, selector and result schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sdd/spatial-bench"

# No CLI dependencies here on purpose: a generated driver links this crate to
# emit the result schema, and should not drag argument parsing or terminal
# handling into that build.
#
# Everything is inlined rather than inherited from the workspace root: this
# crate is also a [patch.crates-io] target for generated driver packages,
# which cargo loads outside its workspace, where inheritance does not
# resolve on older toolchains.

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "1.1"
# The fingerprint checksum: tamper-evidence, not tamper-resistance (design §9).
hmac = "0.12"
sha2 = "0.10"
