name: CI / Stable

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-stable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-stable:
    name: Lint (Stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install `stable` Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-stable:
    name: Test (Stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install `stable` Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cargo nextest
        run: cargo nextest run --workspace

      - name: Cargo test (Doctests)
        run: cargo test --workspace --doc

  # The kiddo driver crate is excluded from the workspace (day 1.5) so it
  # needs its own job — the drift guard compiles kiddo from its pin, which is
  # the check that catches a manifest/driver drift.
  test-driver:
    name: Test (Driver + Drift Guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install `stable` Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Checkout bencher repo (subjects + driver crates)
        uses: actions/checkout@v4
        with:
          repository: spatial-bench/spatial-bench-benchers
          token: ${{ secrets.BENCHER_PAT }}
          path: benchers

      - name: Test the driver crate
        working-directory: benchers/subjects/kiddo/driver
        run: cargo test

      - name: Drift guard
        working-directory: benchers/subjects/kiddo/driver
        run: cargo test --test compile_generated
        env:
          SPATIAL_BENCH_ENGINE_SRC: ${{ github.workspace }}
