# kiddo, as a vendored subject.
#
# kiddo gets no privileged path despite being the engine author's own library:
# its manifest sits alongside nanoflann's and is reviewed the same way. That
# symmetry is the trust argument in the design's "Subjects are always vendored".
#
# Nothing is added to the kiddo repo for any of this. The engine owns the
# harness (design section 5): the driver crate calls kiddo's public API and
# nothing else, so what is measured, how points are generated and what sits
# inside the timed region are all decided here rather than by the subject.

schema = 1
name = "kiddo_v6"
domain = "spatial_index"

# A floor, not a pin: the engine resolves one toolchain per run as the highest
# floor among selected subjects, so everything in a run is built the same way.
[toolchain]
min_rustc = "1.89.0"

[source]
kind = "cargo-git"
repo = "https://github.com/sdd/kiddo"
pinned_ref = "v6.0.0-alpha.4"

# Two-phase: the engine generates a main.rs with one `bench_case!` invocation
# per selected compile-time combination, then builds and runs it. Instantiating
# the full cross product is what makes kiddo's own fuzz binary take an age to
# compile.
[driver]
adapter = "rust-codegen"
crate = "spatial-bench-kiddo-v6"
macro = "bench_case"

# Extension keys this subject contributes, namespaced under `kiddo.` so two
# subjects can both have a `stem` or a `layout` without colliding.
#
# `compile_time` marks a generic parameter: every value is a separate
# monomorphisation, so it drives code generation. Unmarked keys are runtime
# arguments and cost nothing to add to a sweep.
[vocab]
stem.compile_time = true
stem.values = [
  "eytzinger",
  "eytzinger_nopf",
  "eytzinger_flexpf",
  "donnelly",
  "donnelly_nopf",
  "donnelly_unrolled",
  "donnelly_simd_descent",
  "donnelly_simd_full",
  "donnelly_cyclic_simd_descent",
  "donnelly_cyclic_simd_full",
]
leaf.compile_time = true
leaf.values = ["flatvec"]
bucket.compile_time = true
bucket.kind = "int"
storage.values = ["heap", "archived_mmap", "archived_owned"]
executor.values = ["serial", "parallel", "tuned"]
hugepages.values = ["on", "off"]

# One declaration replaces three bench files, three bench-v6-* recipes and the
# KIDDO_PROFILE_{QUERIES,MIN,MAX}_LOG2_POINTS env vars. `matrix` expands it.
[[case]]
runners = ["criterion", "perf"]

matrix.axis = ["f32", "f64"]
matrix.k = [1, 5, 20, 50]

tags.impl = "kiddo_v6"
tags.query = "exact_nn"
tags.dims = 3
tags.idx = "u32"
tags.metric = "squared_euclidean"
tags.isa = "avx512"
tags."kiddo.stem" = "eytzinger"
tags."kiddo.leaf" = "flatvec"
tags."kiddo.bucket" = 32
tags."kiddo.storage" = "heap"
tags."kiddo.executor" = "serial"

# The full range worth sweeping. NOT a capability limit: what actually fits is a
# function of host memory, which is per-machine and so cannot live here -- the
# engine checks feasibility at run time (see `Case::footprint_bytes`).
params.tree_size.range = "2^16..2^29"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000
